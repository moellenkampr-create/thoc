        <h1>URoP Release Notes</h1>
        <p>Dieses Journal dokumentiert die Entwicklung des URoP-Rulesets fuer Foundry VTT.</p>
        <h2>Versionierung</h2>
        <p>Ruleset-Versionen folgen einer dreiteiligen Versionsnummer: <strong>MAJOR.MINOR.PATCH</strong>.</p>
        <ul>
        <li><strong>MAJOR:</strong> inkompatible Datenmodell- oder API-Aenderungen.</li>
        <li><strong>MINOR:</strong> neue Funktionen, Dokumenttypen, Packs oder groessere Erweiterungen.</li>
        <li><strong>PATCH:</strong> Fehlerkorrekturen, Darstellungsverbesserungen und Dokumentationsaenderungen.</li>
        </ul>
        <h2>Release-Workflow</h2>
        <ol>
        <li>Aenderung in Datenmodell, Sheet, Template, Script, Style, Pack oder Dokumentation umsetzen.</li>
        <li>Betroffene Tests ergaenzen und mit <code>node --test tests\\urop-calculations.test.mjs</code> ausfuehren.</li>
        <li>Version in <code>system.json</code> erhoehen.</li>
        <li><code>RELEASE_NOTES.md</code> und diese Journal-Quelle aktualisieren.</li>
        <li>Compendium mit der Foundry-CLI neu kompilieren.</li>
        <li><code>urop-system.zip</code> neu bauen und die Manifest-Version im ZIP pruefen.</li>
        <li><code>git diff --check</code>, Commit und Push ausfuehren.</li>
        <li>In Foundry ueber die Manifest-URL aktualisieren und Pack sowie Journal pruefen.</li>
        </ol>
        <h2>0.1.47 - 2026-08-23</h2>
        <h3>Hinzugefuegt</h3>
        <ul>
        <li>Neues Item-Compendium <strong>URoP Fertigkeiten</strong> im Folder <strong>URoP System</strong>.</li>
        <li>73 Fertigkeiten nach Kampffertigkeiten, Aktionsfertigkeiten und Flufffertigkeiten aufgeteilt.</li>
        <li>Reproduzierbarer Generator und Regressionstest fuer den Fertigkeits-Pack ergaenzt.</li>
        </ul>
        <h2>0.1.46 - 2026-08-22</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Actor-Sheet-Struktur fuer Uebersicht und Attribute korrigiert.</li>
        <li>Boni/Mali-Markup aus der aktiven Attributdarstellung entfernt.</li>
        <li>Datengetriebene Attributgruppen und Anpassbarkeit abgesichert.</li>
        </ul>
        <h2>0.1.45 - 2026-08-22</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Alte Boni/Mali-Struktur entfernt und bestehende Legacy-Felder migriert.</li>
        <li>EP-Berechnung auf 30 EP pro natuerlicher Attributstufe und Fertigkeitskosten pro Stufe umgestellt.</li>
        <li>Formularstand wird vor Item-Erstellen oder -Loeschen gespeichert.</li>
        </ul>
        <h2>0.1.44 - 2026-08-22</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Redundantes hinteres Fertigkeitswertfeld entfernt; der aktuelle Wert bleibt zwischen Minus- und Plus-Button sichtbar.</li>
        </ul>
        <h2>0.1.43 - 2026-08-22</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Boni/Mali-Anzeigen aus Uebersicht und Attributseite entfernt.</li>
        <li>Sonderattribut Anpassbarkeit mit Standardwert 6 ergaenzt.</li>
        <li>Erstellen und Rechtsklick-Loeschen fuer Fertigkeiten, Cyberkampf, Manoever und Ausruestung ergaenzt.</li>
        </ul>
        <h2>0.1.41 - 2026-08-21</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Fertigkeitsdetail-Stepper mit fester Rasterbreite korrigiert.</li>
        <li>Quickhacks in einen eigenen Tab <strong>Cyberkampf</strong> verschoben.</li>
        <li>Cyberkampf um Drei-Würfel-Proben und Quickhack-Typanzeige ergänzt.</li>
        </ul>
        <h2>0.1.40 - 2026-08-21</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Fertigkeiten nach Kampffertigkeiten, Aktionsfertigkeiten und Flufffertigkeiten gruppiert.</li>
        <li>Kampf- und Ausrüstungsbereiche in getrennte Fenster aufgeteilt.</li>
        <li>Kampffertigkeiten um kompakte Drei-Würfel-Proben und die Stufe-Spalte ergänzt.</li>
        <li>Manöver-Reiter direkt hinter den Kampf-Reiter verschoben.</li>
        <li>Fertigkeitsdetail um ein rechtsbündiges Wertfeld ergänzt.</li>
        </ul>
        <h2>0.1.39 - 2026-08-21</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Fertigkeiten-Tabelle durch kompaktere Zeilen und kleinere Probe-Buttons verdichtet.</li>
        <li>Probe-Spalte und Drei-Wuerfel-Buttons mittig ausgerichtet; Stufe rechtsbuendig ausgerichtet.</li>
        <li>Hover-Tipp am Probe-Button zeigt Fertigkeitsname und Probenstufe an.</li>
        </ul>
        <h2>0.1.38 - 2026-08-21</h2>
        <h3>Hinzugefuegt</h3>
        <ul>
        <li>Erstes systemeigenes Journal-Compendium <strong>URoP Documentation</strong> im Folder <strong>URoP System</strong>.</li>
        <li>Dokumentation des Pack- und Versionierungs-Workflows.</li>
        <li>Editierbare Pack-Quelle unter <code>src/packs/urop-documentation/</code>.</li>
        </ul>
        <h2>0.1.37 - 2026-08-21</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Lokaler Foundry-Entwicklungsleitfaden fuer Manifest, DataModel, Sheets, Migrationen, Packs und Releases ergaenzt.</li>
        <li>Offizielle Foundry-Dokumentationsquellen verlinkt.</li>
        </ul>
        <h2>0.1.36 - 2026-08-15</h2>
        <h3>Geaendert</h3>
        <ul>
        <li>Fertigkeiten-Seite als Tabelle mit alternierenden Zeilenfarben gestaltet.</li>
        <li>Proben-Button pro Fertigkeit mit 3W6-Ausloesung und Chat-Ergebnis hinzugefuegt.</li>
        <li>Regelanker in der Fertigkeiten-Tabelle lesbar dargestellt.</li>
        </ul>
        <hr>
        <p><em>Die vollstaendige technische Historie steht zusaetzlich in <code>RELEASE_NOTES.md</code> im Repository.</em></p>
